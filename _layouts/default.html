---
layout: default
---

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8"/>
		<title>{{ page.title | default: site.title }}</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Syne+Mono&family=Sono:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" type="text/css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
		<script src="{{ '/assets/js/jquery.min.js' | relative_url }}"> </script>
		<script src="{{ '/assets/js/jquery-ui.min.js' | relative_url }}"></script>
		<script src="{{ '/assets/js/svg.min.js' | relative_url }}"></script>
		<script src="{{ '/assets/js/threads.js' | relative_url }}"></script>
		<script src="{{ '/assets/js/blog-manager.js' | relative_url }}"></script>
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💭</text></svg>">


		<script>
			// Set bottom buffer height to half page height
			document.addEventListener('DOMContentLoaded', function() {
				const buffer = document.querySelector('.bottom-buffer');
				if (buffer) {
					buffer.style.height = (window.innerHeight / 2) + 'px';
				}
			});
		</script>
	</head>
	<body>
		<div class="container">
			{% include left-column.html %}
			
			<!-- Center Column: Showcase -->
			<div class="center-column">
				<div class="showcase-content">
					<div class="blog-header">
						<h1>Blog</h1>
						<div class="filter-widget">
							<select class="filter-select">
								<option value="all">All Posts</option>
							</select>
						</div>
					</div>
					<p></p>
					
					<div class="featured-projects">
						<!-- Posts will be loaded dynamically by blog-manager.js -->
					</div>
				</div>
			</div>
			
			<!-- Right Column: SVG Wiggles (handled by JavaScript) -->
			<div class="right-column">
				<!-- SVG animations will be inserted here by threads.js -->
			</div>
		</div>
		
	</body>
</html>
