		<script>
			// Set bottom buffer height to half page height
			document.addEventListener('DOMContentLoaded', function() {

				if (buffer) {
					buffer.style.height = (window.innerHeight / 2) + 'px';
				}
			});
		</script>

			<!-- Left Column: Profile & Skills -->
			<div class="left-column">
				<div class="profile-section">
					<div class="headshot">
						<img src="https://placehold.co/150x150/4a4a4a/ffffff?text=PG" alt="Paige Gulley" />

				<div class="social-section">

					<div class="social-links">
						<a href="http://www.github.com/pgulley" class="social-link" title="GitHub" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i> GitHub</a>

			<div class="center-column">

					<h1>Showcase</h1>
					<p>This is where I showcase my creative work, experiments, and projects. </p>
					
					<div class="featured-projects">
						<h2>Featured Work</h2>
						<!-- Content will be loaded dynamically by showcase.js -->
					</div>
					<div class="bottom-buffer">
					</div>
